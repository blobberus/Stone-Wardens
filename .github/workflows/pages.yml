name: Deploy site

# Campaign data (content/, wardens-library/) is read live through the GitHub API,
# so saving characters/notes/pins from the site does not need a redeploy.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'content/**'
      - 'wardens-library/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
