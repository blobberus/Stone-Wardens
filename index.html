<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>The Stone Wardens</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400;1,700&family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/shell.css">
  <link rel="stylesheet" href="assets/css/map.css">
  <link rel="stylesheet" href="assets/css/characters.css">
  <link rel="stylesheet" href="assets/css/journal.css">
  <link rel="stylesheet" href="assets/css/quests.css">
  <link rel="stylesheet" href="assets/css/compendium.css">
  <link rel="stylesheet" href="assets/css/wardens-library.css">
  <link rel="stylesheet" href="assets/css/settings.css">
  <script src="vendor/leaflet/leaflet.js" defer></script>
  <script src="vendor/mammoth/mammoth.browser.min.js" defer></script>
  <script type="module" src="assets/js/main.js"></script>
</head>
<body>
  <div id="gate" class="gate" hidden>
    <form class="gate-card" id="gate-form" autocomplete="on">
      <div class="gate-mark"><svg viewBox="0 0 48 48" aria-hidden="true"><use href="assets/img/icons.svg#i-emblem"/></svg></div>
      <h1 class="gate-title">The Stone Wardens</h1>
      <p class="gate-sub">A Fallen Firmament Campaign</p>
      <input type="text" name="username" value="warden" autocomplete="username" hidden>
      <label class="field"><span class="field-label">Password</span><input class="input" type="password" id="gate-pass" autocomplete="current-password" required></label>
      <label class="checkbox"><input type="checkbox" id="gate-remember"> <span>Remember this device</span></label>
      <button class="btn btn-primary gate-enter" type="submit">Enter</button>
      <p class="gate-error" role="alert" hidden></p>
      <p class="gate-note muted"></p>
    </form>
  </div>

  <div id="app" class="app" hidden>
    <nav id="sidebar" class="sidebar" aria-label="Main">
      <div class="sb-brand">
        <button class="btn-icon sb-toggle" type="button" aria-label="Toggle menu"><svg class="icon" aria-hidden="true"><use href="assets/img/icons.svg#i-menu"/></svg></button>
        <span class="sb-title">Stone Wardens</span>
      </div>
      <ul class="sb-tabs"></ul>
      <div class="sb-spacer"></div>
      <ul class="sb-tabs sb-tabs-bottom"></ul>
      <div class="sb-footer">
        <div class="sb-status" data-state="clean"><span class="sb-dot"></span><span class="sb-status-text">All changes saved</span></div>
        <button class="btn btn-primary btn-sm sb-save" type="button" title="Save to repository (Ctrl+S)">Save</button>
      </div>
    </nav>
    <main id="views" class="views"></main>
  </div>

  <div id="overlays"></div>
  <noscript>This site needs JavaScript.</noscript>
</body>
</html>
